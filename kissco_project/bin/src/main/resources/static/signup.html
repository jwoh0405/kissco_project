<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scheduler - 회원가입</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f6f9;
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }

        /* 폼 애니메이션 (스플래시 없이 부드럽게 등장) */
        .signup-form-wrapper {
            width: 100%;
            max-width: 450px;
            animation: slideUpFade 0.6s ease-out forwards;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-header h2 {
            font-weight: 800;
            color: #2c3e50;
        }

        .password-container {
            position: relative;
        }
        .toggle-pw {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #7f8c8d;
            transition: color 0.2s;
        }
        .toggle-pw:hover {
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="signup-form-wrapper">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                
                <div class="form-header">
                    <h2>회원가입</h2>
                    <p class="text-muted small">Smart Scheduler와 함께 스마트한 일상을 시작하세요.</p>
                </div>

                <form id="signupForm" onsubmit="event.preventDefault(); handleSignup();">
                    
                    <div class="mb-3">
                        <label for="nameInput" class="form-label text-secondary fw-bold">이름 (Name)</label>
                        <input type="text" class="form-control form-control-lg" id="nameInput" placeholder="이름을 입력하세요" required>
                    </div>

                    <div class="mb-3">
                        <label for="emailInput" class="form-label text-secondary fw-bold">이메일 (Email)</label>
                        <input type="email" class="form-control form-control-lg" id="emailInput" placeholder="알림을 받을 이메일 주소" required>
                    </div>

                    <div class="mb-3">
                        <label for="passwordInput" class="form-label text-secondary fw-bold">비밀번호 (Password)</label>
                        <div class="password-container">
                            <input type="password" class="form-control form-control-lg" id="passwordInput" placeholder="비밀번호" required>
                            <i class="fa-regular fa-eye toggle-pw" onclick="togglePassword('passwordInput', this)"></i>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="passwordConfirmInput" class="form-label text-secondary fw-bold">비밀번호 확인</label>
                        <div class="password-container">
                            <input type="password" class="form-control form-control-lg" id="passwordConfirmInput" placeholder="비밀번호를 한 번 더 입력하세요" required>
                            <i class="fa-regular fa-eye toggle-pw" onclick="togglePassword('passwordConfirmInput', this)"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-3" style="background-color: #3498db; border: none;">가입 완료</button>
                    
                    <div class="text-center">
                        <a href="login.html" class="text-decoration-none text-muted small">이미 계정이 있으신가요? 로그인 화면으로</a>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script>
        function handleSignup() 
        {
            const pw = document.getElementById("passwordInput").value;
            const confirm = document.getElementById("passwordConfirmInput").value;

            if (pw !== confirm) 
            {
                alert("비밀번호가 일치하지 않습니다!");
                return;
            }

            alert("회원가입이 완료되었습니다. 로그인 해주세요.");
            location.href = 'login.html';
        }

        function togglePassword(id, icon) 
        {
            const input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
