<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scheduler - 내 계정 관리</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body 
        { 
            font-family: 'Arial', sans-serif; 
            background-color: #f4f6f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }
        
        .profile-container 
        { 
            width: 100%; 
            max-width: 480px; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        
        .avatar 
        { 
            width: 90px; 
            height: 90px; 
            background-color: #3498db; 
            color: white; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 2.5rem; 
            font-weight: bold; 
            margin: 0 auto; 
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }

        input[readonly] 
        { 
            background-color: #ecf0f1 !important; 
            cursor: not-allowed; 
        }

        .password-container 
        { 
            position: relative; 
        }

        .toggle-pw 
        { 
            position: absolute; 
            right: 15px; 
            top: 50%; 
            transform: translateY(-50%); 
            cursor: pointer; 
            color: #7f8c8d; 
        }
    </style>
</head>
<body>

    <div class="profile-container p-4 p-md-5">
        
        <div class="d-flex justify-content-end mb-2">
            <button type="button" class="btn-close" aria-label="Close" onclick="location.href='/dashboard'"></button>
        </div>

        <div class="text-center mb-4">
            <div class="avatar mb-3" id="profileAvatar">노</div>
            <h3 class="fw-bold text-dark">내 계정 정보</h3>
            <p class="text-muted small">계정 보안과 알림 설정을 관리하세요.</p>
        </div>

        <form id="profileForm" onsubmit="event.preventDefault(); saveProfile();">
            
            <div class="mb-4">
                <label class="form-label fw-bold text-secondary small">이메일 (아이디 / 알림 수신용)</label>
                <div class="input-group">
                    <input type="email" class="form-control form-control-lg" id="emailInput" value="sample@kissco.co.jp" readonly required>
                    <button class="btn btn-outline-secondary fw-bold px-3" type="button" id="emailEditBtn" onclick="toggleEmailEdit()">변경</button>
                </div>
                <div id="emailHelpText" class="form-text text-danger fw-bold mt-2" style="display: none;">
                    <i class="fa-solid fa-circle-exclamation"></i> 이메일 변경 시 다음 로그인부터 적용됩니다.
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold text-secondary small">사용자 이름</label>
                <input type="text" class="form-control form-control-lg" id="nameInput" value="노경식" required>
            </div>

            <div class="mb-5">
                <label class="form-label fw-bold text-secondary small">비밀번호 변경</label>
                <div class="password-container">
                    <input type="password" class="form-control form-control-lg" id="passwordInput" placeholder="새로운 비밀번호를 입력하세요">
                    <i class="fa-regular fa-eye toggle-pw" id="toggleIcon" onclick="togglePassword()"></i>
                </div>
                <div class="form-text text-muted mt-1">비밀번호를 변경하지 않으려면 비워두세요.</div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-dark btn-lg fw-bold border-0" style="background-color: #2c3e50;">회원 정보 저장</button>
                <button type="button" class="btn btn-danger btn-lg fw-bold border-0" onclick="logout()">로그아웃</button>
            </div>

        </form>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function(){

	    fetch('/api/members/me', {
	        credentials: 'include'
	    })
	    .then(res => res.json())
	    .then(user => {
	
	        if(!user){
	            alert("로그인이 필요합니다.");
	            location.href = "/login";
	            return;
	        }
	
	        document.getElementById("nameInput").value = user.name;
	        document.getElementById("emailInput").value = user.email;
	
	        document.getElementById("profileAvatar").innerText =
	            user.name.charAt(0);
	
	    });
	
	});
    
        //아바타 실시간 업데이트
        document.getElementById('nameInput').addEventListener('input', function(e) 
        {
            const firstLetter = e.target.value.charAt(0) || "?";
            document.getElementById('profileAvatar').innerText = firstLetter;
        });

        //이메일 수정 모드 토글
        function toggleEmailEdit() 
        {
            const emailInput = document.getElementById("emailInput");
            const editBtn = document.getElementById("emailEditBtn");
            const helpText = document.getElementById("emailHelpText");

            if (emailInput.hasAttribute("readonly")) 
            {
                emailInput.removeAttribute("readonly");
                emailInput.focus();
                editBtn.textContent = "취소";
                editBtn.classList.replace("btn-outline-secondary", "btn-outline-danger");
                helpText.style.display = "block";
            } 
            else 
            {
                emailInput.setAttribute("readonly", true);
                editBtn.textContent = "변경";
                editBtn.classList.replace("btn-outline-danger", "btn-outline-secondary");
                helpText.style.display = "none";
            }
        }

        //비밀번호 보기 토글
        function togglePassword() 
        {
            const pwInput = document.getElementById("passwordInput");
            const toggleIcon = document.getElementById("toggleIcon");
            
            if (pwInput.type === "password") 
            {
                pwInput.type = "text";
                toggleIcon.classList.replace("fa-eye", "fa-eye-slash");
            } 
            else 
            {
                pwInput.type = "password";
                toggleIcon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        //회원 정보 저장 (PUT)
        function saveProfile() 
		{
		    const requestData = 
		    {
		        name: document.getElementById('nameInput').value,
		        email: document.getElementById('emailInput').value,
		        password: document.getElementById('passwordInput').value || null
		    };
		
		    fetch('/api/members/me', 
		    {
		        method: 'PUT',
		        headers: { 'Content-Type': 'application/json' },
		        credentials: 'include',
		        body: JSON.stringify(requestData)
		    })
		    .then(response => response.text())
		    .then(message => {
		
		        if(message === "success"){
		            alert("회원 정보가 성공적으로 변경되었습니다.");
		            location.href = '/dashboard';
		        }else{
		            alert(message); //이미 사용중인 이메일입니다.
		        }
		
		    })
		    .catch(error => console.error("통신 에러:", error));
		}

        //로그아웃 (POST)
        function logout() 
        {
            if (confirm("정말로 로그아웃 하시겠습니까?")) 
            {
                fetch('/api/logout', {
   					method: 'POST',
    				credentials: 'include'
				})
                    .then(response => 
                    {
                        if (response.ok) 
                        {
                            alert("안전하게 로그아웃 되었습니다.");
                            location.href = '/login';
                        }
                    })
                    .catch(error => console.error("로그아웃 에러:", error));
            }
        }
    </script>
</body>
</html>
