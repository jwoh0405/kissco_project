<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scheduler - 스케줄 관리</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body 
        { 
            font-family: 'Arial', sans-serif; 
            background-color: #f4f6f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .form-container 
        { 
            width: 100%; 
            max-width: 600px; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        .checkbox-group 
        { 
            background: #f8f9fa; 
            border-radius: 8px; 
        }
    </style>
</head>
<body>

    <div class="form-container p-4 p-md-5">
        
        <div class="d-flex justify-content-between align-items-center border-bottom border-dark pb-3 mb-4">
            <h3 class="fw-bold mb-0 text-dark" id="formTitle">✏️ 새 스케줄 추가</h3>
            <button type="button" class="btn-close" aria-label="Close" onclick="location.href='dashboard.html'"></button>
        </div>

        <form id="scheduleForm" onsubmit="event.preventDefault(); handleSave();">
            
            <div class="mb-4">
                <label for="titleInput" class="form-label fw-bold text-secondary">스케줄 제목</label>
                <input type="text" class="form-control form-control-lg" id="titleInput" placeholder="어떤 일정이 있나요?" required>
            </div>

            <div class="mb-4">
                <label for="deadlineInput" class="form-label fw-bold text-secondary">마감 일시</label>
                <input type="datetime-local" class="form-control form-control-lg" id="deadlineInput" required>
            </div>

            <div class="mb-4">
                <label for="importanceInput" class="form-label fw-bold text-secondary">중요도</label>
                <select class="form-select form-select-lg" id="importanceInput">
                    <option value="5">⭐⭐⭐⭐⭐ (가장 높음)</option>
                    <option value="4">⭐⭐⭐⭐ (높음)</option>
                    <option value="3" selected>⭐⭐⭐ (보통)</option>
                    <option value="2">⭐⭐ (낮음)</option>
                    <option value="1">⭐ (가장 낮음)</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="contentInput" class="form-label fw-bold text-secondary">메모 사항</label>
                <textarea class="form-control" id="contentInput" rows="4" placeholder="일정에 필요한 준비물이나 상세 내용을 적어주세요."></textarea>
            </div>

            <div class="checkbox-group p-3 mb-2 d-flex align-items-center gap-2">
                <input class="form-check-input mt-0" type="checkbox" id="alertCheck" style="transform: scale(1.3); cursor: pointer;" checked>
                <label class="form-check-label fw-bold ms-2" style="cursor: pointer;" for="alertCheck">
                    마감 전 내 이메일로 알림 받기
                </label>
            </div>

            <div class="checkbox-group p-3 mb-4 align-items-center gap-2" id="completedGroup" style="display: none; background-color: #e8f8f5;">
                <input class="form-check-input mt-0" type="checkbox" id="completedCheck" style="transform: scale(1.3); cursor: pointer;">
                <label class="form-check-label fw-bold ms-2 text-success" style="cursor: pointer;" for="completedCheck">
                    ✅ 이 일정을 성공적으로 완료했습니다!
                </label>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-2">
                <button type="button" class="btn btn-danger fw-bold d-none" id="deleteBtn" onclick="deleteSchedule()">삭제</button> 
                <button type="button" class="btn btn-secondary fw-bold" onclick="location.href='dashboard.html'">취소</button>
                <button type="submit" class="btn btn-primary fw-bold" style="background-color: #2980b9; border: none;">저장</button>
            </div>
            
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const scheduleId = urlParams.get('id');

        document.addEventListener("DOMContentLoaded", function() 
        {
            if (scheduleId) 
            {
                document.getElementById('formTitle').innerText = "📝 스케줄 수정";
                document.getElementById('deleteBtn').classList.remove('d-none');
                
                // 🌟 수정 모드일 때만 완료 체크박스 그룹 표시
                document.getElementById('completedGroup').style.display = 'flex';
                
                // 수정 모드일 때 기존 데이터 불러오기 (GET)
                fetch(`/api/schedules/${scheduleId}`, {
    				credentials: 'include'
				})
                    .then(res => res.json())
                    .then(data => 
                    {
                        document.getElementById('titleInput').value = data.title;
                        document.getElementById('deadlineInput').value = data.deadline;
                        document.getElementById('importanceInput').value = data.importance;
                        document.getElementById('contentInput').value = data.content;
                        document.getElementById('alertCheck').checked = data.alertEnabled;
                        
                        // 🌟 완료 여부 데이터 바인딩
                        document.getElementById('completedCheck').checked = data.isCompleted;
                    })
                    .catch(err => console.error("데이터 로드 에러:", err));
            }
        });

        // 저장 로직 (POST/PUT)
        function handleSave() 
        {
            const requestData = 
            {
                title: document.getElementById('titleInput').value,
                deadline: document.getElementById('deadlineInput').value,
                importance: parseInt(document.getElementById('importanceInput').value),
                content: document.getElementById('contentInput').value,
                alertEnabled: document.getElementById('alertCheck').checked,
                
                // 🌟 체크박스 상태에 따라 isCompleted 값 설정 (없으면 기본값 false)
                isCompleted: document.getElementById('completedCheck') ? document.getElementById('completedCheck').checked : false
            };

            const apiUrl = scheduleId ? `/api/schedules/${scheduleId}` : '/api/schedules';
            const method = scheduleId ? 'PUT' : 'POST';

            fetch(apiUrl, 
            {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(requestData)
            })
            .then(res => 
            {
                if (res.ok) 
                {
                    alert(scheduleId ? "수정되었습니다." : "등록되었습니다.");
                    location.href = 'dashboard.html';
                }
            })
            .catch(err => console.error("저장 에러:", err));
        }

        // 삭제 로직 (DELETE)
        function deleteSchedule() 
        {
            if (confirm("정말로 이 일정을 삭제하시겠습니까?")) 
            {
                fetch(`/api/schedules/${scheduleId}`, { 
   					method: 'DELETE',
    				credentials: 'include'
				})
                    .then(res => 
                    {
                        if (res.ok) 
                        {
                            alert("삭제되었습니다.");
                            location.href = 'dashboard.html';
                        }
                    })
                    .catch(err => console.error("삭제 에러:", err));
            }
        }
    </script>

</body>
</html>
