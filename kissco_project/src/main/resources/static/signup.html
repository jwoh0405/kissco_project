<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scheduler - 회원가입</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body 
        {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f6f9;
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }

        .signup-form-wrapper 
        {
            width: 100%;
            max-width: 450px;
            animation: slideUpFade 0.6s ease-out forwards;
        }

        @keyframes slideUpFade 
        {
            from 
            { 
                opacity: 0; 
                transform: translateY(20px); 
            }
            to 
            { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        .form-header 
        {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h2 
        {
            font-weight: 800;
            color: #2c3e50;
        }

        .password-container 
        {
            position: relative;
        }

        .toggle-pw 
        {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="signup-form-wrapper">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                
                <div class="form-header">
                    <h2>회원가입</h2>
                    <p class="text-muted small">Smart Scheduler와 함께 스마트한 일상을 시작하세요.</p>
                </div>

                <form id="signupForm" onsubmit="event.preventDefault(); handleSignup();">
                    
                    <div class="mb-3">
                        <label for="nameInput" class="form-label text-secondary fw-bold">이름 (Name)</label>
                        <input type="text" class="form-control form-control-lg" id="nameInput" placeholder="이름을 입력하세요" required>
                    </div>

                    <div class="mb-3">
                        <label for="emailInput" class="form-label text-secondary fw-bold">이메일 (Email)</label>
                        <input type="email" class="form-control form-control-lg" id="emailInput" placeholder="sample@kissco.co.jp" required>
                    </div>

                    <div class="mb-3">
                        <label for="passwordInput" class="form-label text-secondary fw-bold">비밀번호 (Password)</label>
                        <div class="password-container">
                            <input type="password" class="form-control form-control-lg" id="passwordInput" placeholder="비밀번호" required>
                            <i class="fa-regular fa-eye toggle-pw" onclick="togglePassword('passwordInput', this)"></i>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="passwordConfirmInput" class="form-label text-secondary fw-bold">비밀번호 확인</label>
                        <div class="password-container">
                            <input type="password" class="form-control form-control-lg" id="passwordConfirmInput" placeholder="비밀번호 확인" required>
                            <i class="fa-regular fa-eye toggle-pw" onclick="togglePassword('passwordConfirmInput', this)"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-3" style="background-color: #3498db; border: none;">가입 완료</button>
                    
                    <div class="text-center">
                        <a href="/login" class="text-decoration-none text-muted small">이미 계정이 있으신가요? 로그인 화면으로</a>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script>
        // 1. 비밀번호 보기/숨기기 토글
        function togglePassword(inputId, iconElement) 
        {
            const pwInput = document.getElementById(inputId);
            
            if (pwInput.type === "password") 
            {
                pwInput.type = "text";
                iconElement.classList.replace("fa-eye", "fa-eye-slash");
            } 
            else 
            {
                pwInput.type = "password";
                iconElement.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        // 2. 🌟 회원가입 실전 로직 (API 통신)
        function handleSignup() 
        {
            const name = document.getElementById("nameInput").value;
            const email = document.getElementById("emailInput").value;
            const password = document.getElementById("passwordInput").value;
            const passwordConfirm = document.getElementById("passwordConfirmInput").value;

            // 비밀번호 일치 확인 (Front-end Validation)
            if (password !== passwordConfirm) 
            {
                alert("비밀번호가 일치하지 않습니다. 다시 확인해주세요.");
                document.getElementById("passwordConfirmInput").focus();
                return;
            }

            const requestData = 
            {
                name: name,
                email: email,
                password: password
            };

            fetch('/api/members', 
            { 
                method: 'POST',
                headers: 
                {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestData)
            })
            .then(response => 
            {
                if (response.ok) 
                {
                    alert(`${name}님, 환영합니다! 가입이 완료되었습니다.`);
                    location.href = '/login';
                } 
                else 
                {
                    alert("회원가입에 실패했습니다. 이미 가입된 이메일인지 확인해주세요.");
                }
            })
            .catch(error => 
            {
                console.error("회원가입 서버 통신 에러:", error);
                alert("서버 연결에 실패했습니다.");
            });
        }
    </script>
</body>
</html>
