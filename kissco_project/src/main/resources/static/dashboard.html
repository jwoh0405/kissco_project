<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scheduler - 대시보드</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body 
        { 
            font-family: 'Arial', 
            sans-serif; background-color: #f4f6f9; 
        }

        /* 네비게이션 커스텀 */
        .navbar-custom 
        { 
            background: white; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        
        .nav-link 
        { 
            font-weight: bold; 
            color: #7f8c8d; 
            transition: color 0.2s; 
        }

        .nav-link:hover 
        { 
            color: #3498db; 
        }

        .nav-link.active 
        { 
            color: #2980b9; 
            border-bottom: 3px solid #2980b9; 
        }

        /* 카드 디자인 커스텀 */
        .schedule-card 
        { 
            background: white; 
            border: none; 
            border-left: 5px solid #bdc3c7; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            transition: transform 0.2s, box-shadow 0.2s; 
            cursor: pointer;
        }
        .schedule-card:hover 
        { 
            transform: translateX(5px); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }

        /* 🌟 완료된 일정 전용 스타일 (취소선, 투명도 등) */
        .schedule-card.completed-schedule 
        {
            opacity: 0.6;
            border-left-color: #bdc3c7 !important; /* 왼쪽 테두리 회색 통일 */
        }
        .completed-text 
        {
            text-decoration: line-through;
            color: #bdc3c7 !important;
        }
        
        /* 🚨 기한 만료 전용 스타일 (붉은색 경고 느낌) */
        .past-due-card 
        {
            background-color: #fff5f5; /* 아주 옅은 붉은 배경 */
            border-left-color: #c0392b !important; /* 진한 붉은 테두리 */
        }
        .past-due-text 
        {
            color: #c0392b !important;
            font-weight: bold;
        }

        /* 중요도별 왼쪽 테두리 색상 */
        .priority-5 { border-left-color: #e74c3c; } 
        .priority-4 { border-left-color: #f39c12; } 
        .priority-3 { border-left-color: #3498db; } 
        .priority-2 { border-left-color: #2ecc71; } 
        .priority-1 { border-left-color: #95a5a6; } 

        .star-rating 
        { 
            color: #f1c40f; 
            letter-spacing: 2px; 
            font-size: 0.9rem; 
        }
        .d-day-badge 
        { 
            border-radius: 20px; 
            font-weight: bold; 
            padding: 5px 12px; 
        }
        
        /* 알림 아이콘 버튼화 (이벤트 버블링 차단용) */
        .notify-btn 
        {
            background: none; 
            border: none; 
            font-size: 1.1rem; 
            cursor: pointer;
            padding: 5px; 
            border-radius: 50%; 
            transition: background 0.2s;
        }
        .notify-btn:hover 
        { 
            background: #f1f2f6; 
        }

        /* 달력 플레이스홀더 */
        .calendar-placeholder 
        { 
            background: white; 
            border: 3px dashed #bdc3c7; 
            border-radius: 10px; 
            min-height: 500px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            color: #7f8c8d; 
        }
    </style>
</head>
<body>


	<nav class="navbar navbar-expand-lg navbar-custom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="/dashboard">📅 Smart Scheduler</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-3 ms-4">
                    <li class="nav-item"><a class="nav-link active" href="/dashboard">진행 일정 보기</a></li>
                    <li class="nav-item"><a class="nav-link">완료 일정 보기</a></li> 
                    <li class="nav-item"><a class="nav-link" href="/input">새 일정 추가</a></li> 
                </ul>
                <div class="d-flex">
                    <button class="btn btn-light rounded-pill fw-bold border" onclick="location.href='/profile'">
                        👤 <span id="userNameDisplay">사용자</span> 님 (계정관리)
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-5">
            
            <div class="col-lg-7">
                <h5 class="fw-bold text-dark border-bottom pb-3 mb-4">📌 다가오는 주요 일정 <span class="text-muted fs-6 fw-normal">(마감일 임박순 / 동일 시 중요도순)</span></h5>
                
                <div id="scheduleListContainer" class="d-flex flex-column gap-3">
                    </div>
            </div>

            <div class="col-lg-5">
                <h5 class="fw-bold text-dark border-bottom pb-3 mb-4">🗓️ 월간 달력</h5>
                <div class="calendar-placeholder">
                    <span style="font-size: 3rem; margin-bottom: 15px;">📅</span>
                    <p class="fw-bold fs-5 mb-1">여기에 달력이 렌더링됩니다.</p>
                    <small>(FullCalendar 라이브러리 연동 대기중)</small>
                </div>
            </div>

        </div>
    </div>

    <script>
        let calendar; 

        document.addEventListener("DOMContentLoaded", function() 
        {
            //서버로부터 스케줄 목록 요청
            fetch('/api/schedules', {
    			credentials: 'include'
			})
                .then(response => response.json())
                .then(data => 
                {
                    //좌측 리스트 렌더링
                    renderSchedules(data); 

                    //우측 달력 이벤트 데이터 주입
                    const calendarEvents = data.map(schedule => ({
                        id: schedule.id,
                        title: schedule.title,
                        start: schedule.deadline,
                        //완료된 일정은 달력에서도 회색으로 표시
                        color: schedule.isCompleted ? '#bdc3c7' : (schedule.importance >= 4 ? '#e74c3c' : '#3498db')
                    }));
                    
                    //달력 객체에 데이터 직접 반영
                    if(calendar) 
                    {	
                    	calendar.addEventSource(calendarEvents);
                    }
                })
                .catch(error => console.error("데이터 로드 실패:", error));

                fetch('/api/members/me', {
    				credentials: 'include'
				})
                .then(response => response.json())
                .then(user => 
                {
                	console.log("현재 로그인 사용자:", user);
                    if (user.name) 
                    {
                        document.getElementById('userNameDisplay').innerText = user.name;
                    }
                })
                .catch(error => 
                {
                    console.error("사용자 정보를 불러올 수 없습니다:", error);
                });
        });

        //리스트 렌더링: JSON 데이터를 받아 HTML 카드로 변환
        function renderSchedules(data) 
        {
            const container = document.getElementById('scheduleListContainer');
            container.innerHTML = ''; 

            data.forEach(schedule => 
            {
                const stars = '⭐'.repeat(schedule.importance);
                const dDayNum = calculateDDay(schedule.deadline);
                
             	//상태에 따른 디자인 로직 3분기
                let dDayText = "";
                let dDayColor = "";
                let customCardClass = "";
                let customTextClass = "";

                if (schedule.isCompleted)
                {
                    //완료된 일정 (우선순위 1등)
                    dDayText = "완료됨";
                    dDayColor = "bg-secondary";
                    customCardClass = "completed-schedule"; 
                    customTextClass = "completed-text";     
                } 
                else if (dDayNum < 0) 
                {
                    //기한이 지난 일정 (완료 안 했는데 날짜가 지남)
                    dDayText = "기한 만료";
                    dDayColor = "bg-dark"; // 검은색 뱃지로 눈에 띄게
                    customCardClass = "past-due-card"; 
                    customTextClass = "past-due-text";
                } 
                else 
                {
                    //정상 진행 중인 일정
                    dDayText = dDayNum === 0 ? "D-Day" : `D-${dDayNum}`;
                    dDayColor = dDayNum === 0 ? "bg-danger" : (dDayNum <= 3 ? "bg-warning text-dark" : "bg-primary");
                }
                
                //메모에 표시되는 글자수 제한 (30자 이후는 ...으로 표시)
                let displayContent = "";
                if (schedule.content) {
                    displayContent = schedule.content.length > 30 
                        ? schedule.content.substring(0, 30) + "..." 
                        : schedule.content;
                }

                const alertIcon = schedule.alertEnabled ? "🔔 알림 켜짐" : "🔕 알림 꺼짐";

                const cardHTML = `
                    <div class="schedule-card priority-${schedule.importance} ${customCardClass} p-3 shadow-sm mb-2" onclick="location.href='/input?id=${schedule.id}'">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="card-info">
                                <div class="star-rating mb-1 ${customTextClass}">${stars}</div>
                                <h5 class="fw-bold mb-1 text-dark ${customTextClass}">${schedule.title}</h5>
                                <div class="text-muted small ${customTextClass}">
                                    <i class="fa-regular fa-clock me-1"></i>${schedule.deadline.replace('T', ' ')}
                                    <span class="ms-2" title="${schedule.content ? schedule.content : ''}">📝 ${displayContent}</span>
                                </div>
                            </div>
                            <div class="card-action text-end">
                                <span class="badge ${dDayColor} d-day-badge mb-2 fs-6">${dDayText}</span>
                                <div>
                                    <button class="notify-btn text-muted" onclick="toggleAlert(event, ${schedule.id}, this)">
                                        ${alertIcon}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        //알림 토글: 서버에 상태 변경(PATCH) 요청
        function toggleAlert(event, id, btnElement) 
        {
            event.stopPropagation(); 
            const isEnabled = btnElement.innerText.includes("켜짐");
            const nextStatus = !isEnabled;

            btnElement.innerText = nextStatus ? "🔔 알림 켜짐" : "🔕 알림 꺼짐";

            fetch(`/api/schedules/${id}/alert`, 
            {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ alertEnabled: nextStatus })
            });
        }

        //D-Day 계산
        function calculateDDay(deadlineStr) 
        {
            const today = new Date();
            const target = new Date(deadlineStr);
            const todayNoon = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const targetNoon = new Date(target.getFullYear(), target.getMonth(), target.getDate());
            
            return Math.floor((targetNoon - todayNoon) / (1000 * 60 * 60 * 24));
        }
    </script>
</body>
</html>
