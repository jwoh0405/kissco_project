<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scheduler - 로그인</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body 
        {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f6f9; 
            font-family: 'Arial', sans-serif;
            overflow: hidden; 
        }

        .title-container 
        {
            font-size: 3rem;
            font-weight: 800;
            color: #2c3e50;
            transition: transform 1s ease-in-out;
            transform: translateY(80px); 
            text-align: center;
            z-index: 2;
        }
        .title-container span 
        {
            color: #3498db; 
        }

        .login-form-wrapper 
        {
            width: 100%;
            max-width: 400px;
            opacity: 0;
            transition: all 1s ease-in-out;
            transform: translateY(20px);
            z-index: 1;
        }

        .title-container.active 
        {
            transform: translateY(-20px);
        }
        .login-form-wrapper.active 
        {
            opacity: 1;
            transform: translateY(0);
        }

        .password-container 
        {
            position: relative;
        }
        .toggle-pw 
        {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="title-container" id="mainTitle">
        🗓️ Smart <span>Scheduler</span>
    </div>

    <div class="login-form-wrapper" id="loginForm">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form id="authForm" onsubmit="event.preventDefault(); handleLogin();">
                    
                    <div class="mb-3">
                        <label for="emailInput" class="form-label text-secondary fw-bold">이메일</label>
                        <input type="email" class="form-control form-control-lg" id="emailInput" placeholder="sample@kissco.co.jp" required>
                    </div>

                    <div class="mb-4">
                        <label for="passwordInput" class="form-label text-secondary fw-bold">비밀번호</label>
                        <div class="password-container">
                            <input type="password" class="form-control form-control-lg" id="passwordInput" placeholder="비밀번호를 입력하세요" required>
                            <i class="fa-regular fa-eye toggle-pw" id="toggleIcon" onclick="togglePassword()"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold" style="background-color: #2c3e50; border: none;">로그인</button>
                    
                    <div class="text-center mt-3">
                        <a href="/signup" class="text-decoration-none text-muted small">계정이 없으신가요? 회원가입</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
    	(function checkMessage() {
        	const urlParams = new URLSearchParams(window.location.search);
        	if (urlParams.get('msg') === 'require') {
          		alert("로그인이 필요한 서비스입니다.");

            	const cleanUrl = window.location.pathname;
            	window.history.replaceState({}, document.title, cleanUrl);
        	}
    	})();
    
    
        //스플래시 애니메이션 실행
        window.onload = function() 
        {
            setTimeout(function() 
            {
                document.getElementById('mainTitle').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            }, 1000); 
        };

        //비밀번호 보이기/숨기기 토글 함수
        function togglePassword() 
        {
            const pwInput = document.getElementById("passwordInput");
            const toggleIcon = document.getElementById("toggleIcon");
            
            if (pwInput.type === "password") 
            {
                pwInput.type = "text";
                toggleIcon.classList.remove("fa-eye");
                toggleIcon.classList.add("fa-eye-slash");
            } 
            else 
            {
                pwInput.type = "password";
                toggleIcon.classList.remove("fa-eye-slash");
                toggleIcon.classList.add("fa-eye");
            }
        }

        //로그인 처리 로직 (REST API 통신)
        function handleLogin() 
        {
            const email = document.getElementById("emailInput").value;
            const password = document.getElementById("passwordInput").value;

            const requestData = 
            {
                email: email,
                password: password
            };

            fetch('/api/login', 
            {
                method: 'POST',
                headers: 
                {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify(requestData)
            })
            .then(response => 
            {
                if (response.ok) 
                {
                    //서버가 성공(200 OK)을 보내면 대시보드로 이동
                    location.href = '/dashboard';
                } 
                else 
                {
                    //인증 실패 시 사용자 알림
                    alert("이메일 또는 비밀번호가 일치하지 않습니다.");
                }
            })
            .catch(error => 
            {
                console.error("로그인 서버 통신 에러:", error);
                alert("서버 연결에 실패했습니다. 네트워크 상태를 확인해주세요.");
            });
        }
    </script>
</body>
</html>
