<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scheduler - 로그인</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f6f9; 
            font-family: 'Arial', sans-serif;
            overflow: hidden; 
        }

        .title-container {
            font-size: 3rem;
            font-weight: 800;
            color: #2c3e50;
            transition: transform 1s ease-in-out;
            transform: translateY(80px); 
            text-align: center;
            z-index: 2;
        }
        .title-container span {
            color: #3498db; 
        }

        .login-form-wrapper {
            width: 100%;
            max-width: 400px;
            opacity: 0;
            transition: all 1s ease-in-out;
            transform: translateY(20px);
            z-index: 1;
        }

        .title-container.active {
            transform: translateY(-20px);
        }
        .login-form-wrapper.active {
            opacity: 1;
            transform: translateY(0);
        }

        .password-container {
            position: relative;
        }
        .toggle-pw {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="title-container" id="mainTitle">
        🗓️ Smart <span>Scheduler</span>
    </div>

    <div class="login-form-wrapper" id="loginForm">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form id="authForm" onsubmit="event.preventDefault(); handleLogin();">
                    
                    <div class="mb-3">
                        <label for="emailInput" class="form-label text-secondary fw-bold">이메일</label>
                        <input type="email" class="form-control form-control-lg" id="emailInput" placeholder="sample@kissco.co.jp" required>
                    </div>

                    <div class="mb-4">
                        <label for="passwordInput" class="form-label text-secondary fw-bold">비밀번호</label>
                        <div class="password-container">
                            <input type="password" class="form-control form-control-lg" id="passwordInput" placeholder="비밀번호를 입력하세요" required>
                            <i class="fa-regular fa-eye toggle-pw" id="toggleIcon" onclick="togglePassword()"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold" style="background-color: #2c3e50; border: none;">로그인</button>
                    
                    <div class="text-center mt-3">
                        <a href="signup.html" class="text-decoration-none text-muted small">계정이 없으신가요? 회원가입</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() 
        {
            setTimeout(function() 
            {
                document.getElementById('mainTitle').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            }, 1000); 
        };

        function handleLogin() 
        {
            const email = document.getElementById("emailInput").value;
            alert(email + "님, 환영합니다!");
            location.href = 'dashboard.html';
        }

        function togglePassword() 
        {
            const pwInput = document.getElementById("passwordInput");
            pwInput.type = pwInput.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
